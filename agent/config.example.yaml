# ⚠️ FICTIONAL BUSINESS — demo data only. Not a real clinic, not a real address.
#
# One business = one config. The prompts are never edited per business:
# everything the agent is allowed to state must be in here. Anything else escalates.
# Phone numbers and notification targets live in .env, not here.

negocio:
  nombre: "Clínica Dental Ejemplo"
  slug: "clinica-ejemplo"
  descripcion_corta: "clínica dental"
  barrio: "Centro"
  direccion: "Calle Ejemplo 1, Madrid"
  como_llegar: "A cinco minutos del metro."
  zona_horaria: "Europe/Madrid"
voz:
  tratamiento: "usted"          # tu | usted — clinics: more formal
  idiomas: ["es", "en"]
  aviso_grabacion: false        # true → recording notice in the greeting
horarios:
  lunes:     ["09:00-14:00", "16:00-20:00"]
  martes:    ["09:00-14:00", "16:00-20:00"]
  miercoles: ["09:00-14:00", "16:00-20:00"]
  jueves:    ["09:00-14:00", "16:00-20:00"]
  viernes:   ["09:00-15:00"]
  sabado:    []
  domingo:   []
festivos: ["2026-11-09", "2026-12-08", "2026-12-25", "2027-01-01", "2027-01-06"]
citas:
  buffer_min: 10                # gap kept between appointments
  paso_min: 15                  # slot grid offered to callers
  antelacion_max_dias: 60
  servicios:
    - {id: "revision",       nombre: "Revisión y diagnóstico",    duracion_min: 30, precio: "Primera visita gratuita"}
    - {id: "limpieza",       nombre: "Limpieza bucal",            duracion_min: 45, precio: "60 €"}
    - {id: "empaste",        nombre: "Empaste",                   duracion_min: 45, precio: "desde 75 €"}
    - {id: "endodoncia",     nombre: "Endodoncia",                duracion_min: 90, precio: "desde 180 €"}
    - {id: "blanqueamiento", nombre: "Blanqueamiento",            duracion_min: 60, precio: "290 €"}
    - {id: "ortodoncia",     nombre: "Primera visita ortodoncia", duracion_min: 30, precio: "Valoración gratuita"}
  profesionales:
    - {nombre: "Dra. Ruiz",   hace: ["revision", "limpieza", "empaste", "endodoncia", "blanqueamiento"]}
    - {nombre: "Dr. Martín",  hace: ["revision", "ortodoncia"]}
  eleccion_profesional: true
  politica_cancelacion: true
  horas_aviso: 24
faq:
  parking: "Hay un parking público a tres minutos."
  pago: "Efectivo, tarjeta y financiación en tratamientos desde 300 €."
  seguros: "ESCALAR"            # insurance coverage → always a human
  primera_visita: "La primera visita de valoración es gratuita y dura media hora."
  urgencias: "Si es una urgencia con dolor, se le da hueco el mismo día. Le paso con la clínica."
escalado:
  transferencia_activa: true    # number comes from TRANSFER_NUMBER in .env
  horas_transferencia: ["09:00-14:00", "16:00-20:00"]
  destino_recados: "WhatsApp"
